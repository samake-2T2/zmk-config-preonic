# Keyboardio Preonic 사용자 설정

# 키보드 이름 설정
CONFIG_ZMK_KEYBOARD_NAME="Preonic"

# 블루투스 무선 출력 최적화 (+8dBm 최대 출력으로 연결 안정성 확보)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 키 입력 디바운스 최적화 (1ms 즉시 반응, 5ms 릴리즈로 키씹힘 및 중복 방지)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# [RGB Underglow] 나비 로고 LED 설정
CONFIG_ZMK_RGB_UNDERGLOW=y
# 부팅 시 자동 점등 활성화
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# 부팅 시 기본 효과: 1 = Breathe (하늘색 숨쉬기)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=1
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=195
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=2

# 전원 관리 및 절전 (EXT_POWER 연동으로 대기 누설 전류 완전 차단)
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 배터리 잔량 보고 및 마우스 키
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_POINTING=y
